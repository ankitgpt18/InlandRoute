<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="fav-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#050507" />
    </linearGradient>
    <linearGradient id="fav-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="fav-river" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <radialGradient id="fav-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="1" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#fav-bg)" stroke="url(#fav-border)" stroke-width="8" />
  <circle cx="256" cy="256" r="160" fill="url(#fav-glow)" opacity="0.2" />

  <!-- Outer River Channel Ribbon -->
  <path d="M 116 112 C 180 180, 204 294, 276 294 C 336 294, 362 220, 416 264 C 402 284, 344 340, 260 334 C 184 328, 140 224, 116 112 Z" fill="url(#fav-river)" />
  <!-- Centerline navigation fairway -->
  <path d="M 148 132 C 196 200, 216 280, 272 280 C 324 280, 350 234, 388 260" stroke="#f8fafc" stroke-width="12" stroke-linecap="round" />

  <!-- Radar Target / Beacon Signal Point -->
  <circle cx="366" cy="168" r="28" fill="#38bdf8" opacity="0.35" />
  <circle cx="366" cy="168" r="16" fill="#38bdf8" />
  <circle cx="366" cy="168" r="7" fill="#ffffff" />
</svg>
