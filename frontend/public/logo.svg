<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Dark rounded squircle background gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="50%" stop-color="#0e0f12" />
      <stop offset="100%" stop-color="#050507" />
    </linearGradient>

    <!-- Glowing border gradient -->
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#1d4ed8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.5" />
    </linearGradient>

    <!-- Primary River Fairway Gradient -->
    <linearGradient id="river-main" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="45%" stop-color="#0284c7" />
      <stop offset="80%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <!-- Secondary Depth Contour Gradient -->
    <linearGradient id="river-contour" x1="10%" y1="20%" x2="90%" y2="80%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.2" />
    </linearGradient>

    <!-- Radar / Satellite Ping Glow -->
    <radialGradient id="beacon-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="1" />
      <stop offset="40%" stop-color="#0284c7" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
    </radialGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="glow-filter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base with Border -->
  <rect x="20" y="20" width="472" height="472" rx="112" fill="url(#bg-grad)" stroke="url(#border-grad)" stroke-width="4" />

  <!-- Ambient Glow Behind River Flow -->
  <circle cx="256" cy="256" r="160" fill="url(#beacon-glow)" opacity="0.18" />

  <!-- Bathymetric Depth Contour Arc 1 -->
  <path d="M 120 170 C 180 120, 310 130, 390 200" stroke="#0ea5e9" stroke-opacity="0.25" stroke-width="2.5" stroke-dasharray="6 8" />
  
  <!-- Bathymetric Depth Contour Arc 2 -->
  <path d="M 100 310 C 180 370, 320 370, 410 290" stroke="#0284c7" stroke-opacity="0.3" stroke-width="2.5" stroke-dasharray="6 8" />

  <!-- Outer River Channel Ribbon -->
  <path d="M 104 130 C 170 190, 190 280, 260 280 C 330 280, 350 200, 408 260 C 378 300, 310 330, 240 320 C 170 310, 130 210, 104 130 Z" fill="url(#river-contour)" opacity="0.35" />

  <!-- Primary Dynamic Fairway Ribbon (Smooth River Curve) -->
  <path d="M 116 112 C 180 180, 204 294, 276 294 C 336 294, 362 220, 416 264 C 402 284, 344 340, 260 334 C 184 328, 140 224, 116 112 Z" fill="url(#river-main)" filter="url(#glow-filter)" />

  <!-- Inner Streamline / Navigability Channel Centerline -->
  <path d="M 148 132 C 196 200, 216 280, 272 280 C 324 280, 350 234, 388 260" stroke="#f8fafc" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0.9" />

  <!-- Satellite Orbit / Radar Arc -->
  <path d="M 310 120 A 70 70 0 0 1 420 220" stroke="#38bdf8" stroke-width="3" stroke-dasharray="4 6" opacity="0.75" />
  <path d="M 334 136 A 46 46 0 0 1 404 204" stroke="#06b6d4" stroke-width="2" opacity="0.6" />

  <!-- Radar Target / Beacon Signal Point -->
  <circle cx="366" cy="168" r="14" fill="#38bdf8" opacity="0.3" />
  <circle cx="366" cy="168" r="8" fill="#38bdf8" />
  <circle cx="366" cy="168" r="3.5" fill="#ffffff" />

  <!-- River Telemetry Waypoints -->
  <circle cx="180" cy="180" r="4.5" fill="#38bdf8" />
  <circle cx="272" cy="280" r="5" fill="#38bdf8" />
</svg>
